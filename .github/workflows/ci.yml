name: Checks

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any model must load from a local cache; never reach the Hugging Face API.
  HF_HUB_OFFLINE: "1"

jobs:
  # The review window's frontend. The Python jobs do not need it: the
  # window's Python side is tested with pywebview stood in.
  frontend:
    name: Frontend · types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  check:
    name: Python ${{ matrix.python-version }} · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        # Adds the label shown in the job name to every combination of that OS.
        include:
          - { os: ubuntu-latest, label: Linux }
          - { os: macos-latest, label: macOS }
          - { os: windows-latest, label: Windows }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run poe lint

      - name: Format check
        run: uv run poe format-check

      - name: Type check
        run: uv run poe types

      # pytest-socket (--disable-socket, see pyproject) fails any test that
      # opens a socket, enforcing the offline-only constraint. The task also
      # applies both coverage floors defined in pyproject.
      - name: Test
        run: uv run poe cov

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "### Coverage (${{ matrix.os }}, py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  # A regression check against the latest release: the rules alone on the
  # benchmark documents (no model to download), compared per item type with
  # the results attached to that release. It reports in the job summary and
  # never fails: a lower score may be a fair trade, and the reviewer decides.
  benchmark-diff:
    name: Benchmark · rules against the latest release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Run the rules on the benchmark documents
        continue-on-error: true
        run: uv run python -m benchmark run --systems rules --out benchmark-results > /dev/null

      - name: Download the latest release's results
        continue-on-error: true
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern benchmark-results.json --dir baseline

      - name: Compare
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -f benchmark-results/results.json ]; then
            echo "The benchmark run failed; see the job log." >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f baseline/benchmark-results.json ]; then
            echo "The latest release has no benchmark results to compare with." >> "$GITHUB_STEP_SUMMARY"
          else
            uv run python -m benchmark diff baseline/benchmark-results.json \
              benchmark-results/results.json >> "$GITHUB_STEP_SUMMARY"
          fi
