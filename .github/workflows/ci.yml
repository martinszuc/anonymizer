name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any model must load from a local cache; never reach the Hugging Face API.
  HF_HUB_OFFLINE: "1"

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # pytest-socket (--disable-socket, see pyproject) fails any test that
      # opens a socket, enforcing the offline-only constraint.
      - name: Test
        run: uv run pytest
