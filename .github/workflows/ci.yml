name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any model must load from a local cache; never reach the Hugging Face API.
  HF_HUB_OFFLINE: "1"

jobs:
  # Runs every pre-commit hook, so the rules they enforce (no committed
  # documents, formatting) hold even for commits made without the hooks.
  hooks:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Run hooks
        run: uv run poe hooks --show-diff-on-failure

  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run poe lint

      - name: Format check
        run: uv run poe format-check

      - name: Type check
        run: uv run poe types

      # pytest-socket (--disable-socket, see pyproject) fails any test that
      # opens a socket, enforcing the offline-only constraint. The task also
      # applies both coverage floors defined in pyproject.
      - name: Test
        run: uv run poe cov

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "### Coverage (${{ matrix.os }}, py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
