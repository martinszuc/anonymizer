name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Any model must load from a local cache; never reach the Hugging Face API.
  HF_HUB_OFFLINE: "1"

jobs:
  # The review window's frontend. The Python jobs do not need it: the
  # window's Python side is tested with pywebview stood in.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  check:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run poe lint

      - name: Format check
        run: uv run poe format-check

      - name: Type check
        run: uv run poe types

      # pytest-socket (--disable-socket, see pyproject) fails any test that
      # opens a socket, enforcing the offline-only constraint. The task also
      # applies both coverage floors defined in pyproject.
      - name: Test
        run: uv run poe cov

      - name: Coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "### Coverage (${{ matrix.os }}, py${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
