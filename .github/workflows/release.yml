name: Release

# release-please keeps an open "chore: release X.Y.Z" pull request that bumps
# the version and writes CHANGELOG.md from the Conventional Commits on main.
# Merging that pull request tags the commit and creates the GitHub release;
# the build job then attaches the wheels and source archives to it.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheels and source archives
        run: uv build --all-packages --out-dir dist

      # Installs the built wheels into a clean environment, not the workspace,
      # so a file missing from a wheel (the resource catalog, say) shows here.
      - name: Check the built packages
        run: |
          uv venv --python 3.12 /tmp/release-check
          uv pip install --python /tmp/release-check dist/*.whl
          test "$(/tmp/release-check/bin/anonymize --version)" = "$VERSION"
          /tmp/release-check/bin/python -c "from anonymizer.core.resources import load_catalog; load_catalog()"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
