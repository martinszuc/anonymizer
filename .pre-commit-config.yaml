repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace

  - repo: local
    hooks:
      # Run ruff from the project environment so uv.lock is the only place
      # its version is pinned; a separate hook pin drifts from what CI runs.
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Documents and images are generated by the tests (tests/pdf_builders.py)
      # or live in the git-ignored data/; a committed one may carry real
      # personal data. Hand-written synthetic fixtures go in tests/fixtures/.
      - id: no-documents
        name: no documents or images outside tests/fixtures/
        entry: >-
          Documents and images must not be committed. Build them in the test
          (tests/pdf_builders.py) or place a synthetic fixture under tests/fixtures/.
        language: fail
        files: '(?i)\.(pdf|png|jpe?g|gif|bmp|tiff?|webp|heic|docx?|odt|xlsx?|ods|pptx?|odp)$'
        exclude: ^tests/fixtures/
