  "1. Zahájení. Shromáždění zahájil předseda výboru [[person:Zdeněk Vrána]], který konstatoval, že je přítomno 64 % hlasů a shromáždění je usnášeníschopné. Zapisovatelkou byla zvolena [[person:Olga Benešová]].",
