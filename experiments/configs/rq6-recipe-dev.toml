name = "rq6-recipe-dev"
description = """
RQ6 recipe sweep, stage A, on development data: GLiNER cross-entropy with the real
corpora (CNEC 2.0, UNER Slovak-SNK train) repeated 1, 3, 5 or 10 times and 2,000, 5,000
or 10,000 steps (experiments/configs/recipe/), each against train-cs-sk-ce --tag gpu
(1×, 2,000 steps), all trained on MetaCentrum (fobos, NVIDIA L40S), the config's seed
only. Every model is scored at GLiNER's default threshold 0.3; the threshold is chosen
for the recipes that stage B carries forward. Train the eleven models first."""
stage = "dev"
seed = 20261010
resamples = 1000
compare = [
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r1-s5k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r1-s10k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r3-s2k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r3-s5k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r3-s10k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r5-s2k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r5-s5k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r5-s10k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r10-s2k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r10-s5k"],
    ["rules+gliner-cs-sk-ce-gpu", "rules+gliner-recipe-r10-s10k"],
]

[[datasets]]
id = "cnec-2.0"
split = "dtest"

[[datasets]]
id = "uner-sk-snk"
split = "dev"

[[datasets]]
id = "redact"
split = "sample"

[[datasets]]
id = "openpii-1m-cs"
split = "dev"

[[datasets]]
id = "openpii-1m-sk"
split = "dev"

[systems."rules+gliner"]
model = "gliner"

[systems."rules+gliner-cs-sk-ce-gpu"]
model = "gliner-cs-sk-ce-gpu"

[systems."rules+gliner-recipe-r1-s5k"]
model = "gliner-recipe-r1-s5k"

[systems."rules+gliner-recipe-r1-s10k"]
model = "gliner-recipe-r1-s10k"

[systems."rules+gliner-recipe-r3-s2k"]
model = "gliner-recipe-r3-s2k"

[systems."rules+gliner-recipe-r3-s5k"]
model = "gliner-recipe-r3-s5k"

[systems."rules+gliner-recipe-r3-s10k"]
model = "gliner-recipe-r3-s10k"

[systems."rules+gliner-recipe-r5-s2k"]
model = "gliner-recipe-r5-s2k"

[systems."rules+gliner-recipe-r5-s5k"]
model = "gliner-recipe-r5-s5k"

[systems."rules+gliner-recipe-r5-s10k"]
model = "gliner-recipe-r5-s10k"

[systems."rules+gliner-recipe-r10-s2k"]
model = "gliner-recipe-r10-s2k"

