name = "rq6-test-posthoc-uner"
description = """
POST HOC addendum to rq6-test, run after the final test (29 Oct) and reported apart from it;
the final table and its verdict stay as they are. On development data NameTag 3 multilingual
scored better on UNER-SK in its uner tagset than in conll, the tagset of every earlier run
(nametag-tagset-dev, repo PR #149). This run re-scores the opponent in uner on the same main
test sets, beside conll as a control (its scores must equal the rq6-test row; NameTag ran on
the CPU there too). The final model is not re-run: its test scores are those of rq6-test, so
the two are compared by point estimate, not paired. Run on the M4 Pro CPU. No choice depends
on it: the final model was fixed on 22 Oct."""
stage = "final"
seed = 20261010
resamples = 1000
compare = [
    ["rules+nametag-multi", "rules+nametag-multi-uner"],
]

[[datasets]]
id = "redact"
split = "test"

[[datasets]]
id = "cnec-2.0"
split = "etest"

[[datasets]]
id = "uner-sk-snk"
split = "test"

[systems."rules+nametag-multi"]
model = "nametag3-multilingual-260521"

[systems."rules+nametag-multi-uner"]
model = "nametag3-multilingual-260521"
tagset = "uner"

