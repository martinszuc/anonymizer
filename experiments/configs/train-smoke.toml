name = "train-smoke"
description = """
Smoke run of the training path (2026-10-10): a hundred examples from each train
split, 40 steps, scored on the first 25 documents of each development split.
Proves the path and times a step; its scores say nothing about the model."""
model = "gliner-cs-sk-smoke"
base = "gliner-multi-v2.1"
seed = 20261010
device = "mps"

[training]
steps = 40
batch_size = 8
learning_rate = 1e-5
head_learning_rate = 5e-5
weight_decay = 0.01
warmup_ratio = 0.1
loss = "focal"
focal_alpha = 0.75
focal_gamma = 2.0
logging_steps = 5

[[corpora]]
id = "openpii-1m-cs"
split = "train"
examples = 100

[[corpora]]
id = "openpii-1m-sk"
split = "train"
examples = 100

[[corpora]]
id = "cnec-2.0"
split = "train"
examples = 100

[[corpora]]
id = "uner-sk-snk"
split = "train"
examples = 100

[evaluate]
limit = 25
datasets = [
    { id = "cnec-2.0", split = "dtest" },
    { id = "uner-sk-snk", split = "dev" },
    { id = "redact", split = "sample" },
    { id = "openpii-1m-cs", split = "dev" },
    { id = "openpii-1m-sk", split = "dev" },
]
