[project]
name = "anonymizer-cli"
version = "0.0.0"
description = "Command-line client for the anonymizer core library"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["anonymizer-core"]

[project.scripts]
anonymize = "anonymizer.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]

[tool.uv.sources]
anonymizer-core = { workspace = true }
