[project]
name = "anonymizer-core"
dynamic = ["version"]
description = "Offline detection and redaction of personal data in documents"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/anonymizer/core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]
