[project]
name = "anonymizer-core"
version = "0.0.0"
description = "Offline detection and redaction of personal data in documents"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
# Name detection. Pulls in PyTorch, so it is kept out of the default install.
ner = ["gliner>=0.2.29,<0.3", "protobuf>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]
