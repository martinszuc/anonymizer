[project]
name = "anonymizer-core"
dynamic = ["version"]
description = "Offline detection and redaction of personal data in documents"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
# Pillow decodes images (JPEG, PNG, TIFF) and applies their EXIF orientation,
# which PyMuPDF ignores in PNG and TIFF.
dependencies = ["pillow>=11", "platformdirs>=4", "py3langid>=0.3", "pymupdf>=1.24"]

[project.optional-dependencies]
# Name detection. Pulls in PyTorch, so it is kept out of the default install.
# NameTag 3 runs on torch and transformers directly: h5py reads its Keras
# checkpoint, ufal.udpipe the tokenizer shipped with each model.
ner = [
    "gliner>=0.2.29,<0.3",
    "h5py>=3.12",
    "protobuf>=4",
    "torch>=2.8",
    "transformers>=5.5",
    "ufal.udpipe>=1.4",
]
# OCR with OnnxTR: onnxruntime, no PyTorch. Headless OpenCV, as no window is opened.
ocr-onnxtr = ["onnxtr[cpu-headless]>=0.9,<0.10"]
# Handwriting-capable OCR with kraken (baseline segmentation, PP-OCRv6 line recognition).
# Pulls in PyTorch and Lightning.
ocr-kraken = ["kraken>=7.1.1,<7.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/anonymizer/core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymizer"]
