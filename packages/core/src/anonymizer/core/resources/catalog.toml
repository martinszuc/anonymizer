# Every model and dataset the project uses, pinned and checksummed.
#
# Read by the download script, the evaluation and the app's model setup page.
# Nothing here is fetched automatically: a download happens only when a user
# asks for one entry by id, and a file whose checksum differs is refused.
#
# Resource fields:
#   id          stable name; the files land in models/<id>/ or data/<id>/
#   kind        "model" or "dataset"
#   uses        what it serves: ner, tokenizer, ocr-detection, ocr-recognition,
#               ocr-layout, benchmark
#   engine      the package that consumes a model (gliner, easyocr, ...)
#   version     the source's own immutable pin: a commit, or a repository handle
#   licence     SPDX identifier where one exists
#   languages   ISO 639-1 codes; "mul" for a multilingual resource
#   requires    ids that must be present for this one to work
#   real_personal_data  true when the content names real people: local
#               evaluation only, never a test fixture
#
# File fields:
#   path        location inside the resource directory
#   url         HTTPS, pinned to the version above
#   size        bytes
#   sha256      the check every download must pass
#   source_digest  "md5:<hex>" or "git-sha1:<hex>" as published by the source,
#               for files whose SHA-256 the source does not publish. Such a
#               file is fetched only with --pin, verified against this digest,
#               and its SHA-256 is then recorded here.
#   unpack      "zip": extract next to the archive after verification

schema = 1

