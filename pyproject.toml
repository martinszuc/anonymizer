[project]
name = "anonymizer-workspace"
version = "0.0.0"
description = "Development workspace for the document anonymization tool"
requires-python = ">=3.12"
dependencies = [
    "anonymizer-core",
    "anonymizer-cli",
    "anonymizer-ui",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pytest-cov>=7.1.0",
    "poethepoet>=0.48.0",
    # Screen capture and WebP encoding for scripts/ui_tour.py; CCITT and CMYK
    # scan fixtures in the tests.
    "pillow>=11",
]
ner = ["anonymizer-core[ner]"]
benchmark = ["matplotlib>=3.9"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
anonymizer-core = { workspace = true }
anonymizer-cli = { workspace = true }
anonymizer-ui = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RET",       # return style
    "ARG",       # unused arguments
    "TID",       # tidy imports
    "ANN",       # annotations
    "D",         # pydocstyle
    "RUF",
]
ignore = [
    "D100",  # module docstring not required
    "D104",  # package docstring not required
    "D107",  # __init__ docstring not required (documented on the class)
    "ANN401",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "ARG"]

[tool.pyright]
include = ["packages", "scripts", "tests", "benchmark"]
exclude = ["**/.venv", "experiments"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "--disable-socket --allow-unix-socket --strict-markers -q"
markers = [
    "model: requires a locally downloaded model; skipped when the model is absent",
    "dataset: requires a locally downloaded corpus; skipped when the corpus is absent",
]

[tool.coverage.run]
branch = true
source = ["packages/core/src", "packages/cli/src", "packages/ui/src"]
# Paths relative to the repo root, so reports read the same on every OS.
relative_files = true

[tool.coverage.report]
fail_under = 93
show_missing = true
skip_covered = true

# Tasks: `uv run poe <task>`, `uv run poe` lists them. CI calls the same tasks,
# so every threshold is defined here once.
[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint" }
format-check = { cmd = "ruff format --check .", help = "Check formatting" }
types = { cmd = "pyright", help = "Type check" }
test = { cmd = "pytest", help = "Run the tests" }
hooks = { cmd = "pre-commit run --all-files", help = "Run every pre-commit hook" }

# A regression in redaction leaks data, so redact/ has a higher floor than the
# overall one in [tool.coverage.report].
cov-redact = { cmd = "coverage report --include='packages/core/src/anonymizer/core/redact/*' --fail-under=95", help = "Coverage floor for redact/" }

[tool.poe.tasks.cov]
help = "Run the tests with branch coverage and both floors"
sequence = [{ cmd = "pytest --cov" }, { ref = "cov-redact" }]

[tool.poe.tasks.fix]
help = "Fix lint findings and format"
sequence = ["ruff check --fix .", "ruff format ."]
default_item_type = "cmd"

[tool.poe.tasks.check]
help = "Everything CI checks: lint, format, types, tests with coverage"
sequence = ["lint", "format-check", "types", "cov"]
# Run every step and fail at the end, so one run lists all problems.
ignore_fail = "return_non_zero"
